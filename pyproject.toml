[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warrant"
version = "0.2.0"
description = "Certify a detector against a false-positive budget, or refuse."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Deliberately minimal. The customer path -- `warrant certify` -- reads a CSV and
# does binomial arithmetic; it needs numpy, scipy and a YAML parser and nothing
# else. torch, transformers and the rest belong to the research pipeline and are
# in requirements.txt, so a prospective user installing this to try their own
# scores does not pull a deep-learning stack to do it.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Aditya26189/Warrant"
Documentation = "https://github.com/Aditya26189/Warrant/blob/main/docs/README.md"
Source = "https://github.com/Aditya26189/Warrant"
Issues = "https://github.com/Aditya26189/Warrant/issues"

[project.scripts]
warrant = "controlplane.cli:main"

[tool.setuptools]
# The package is `controlplane` and the product is Warrant. That split is
# deliberate and documented: renaming the package touches 170 files and no user
# ever sees it. DECISIONS 122, D1.
packages = [
    "controlplane",
    "controlplane.coordination",
    "controlplane.demo",
    "controlplane.detectors",
    "controlplane.drift",
    "controlplane.economics",
    "controlplane.evalsets",
    "controlplane.external",
    "controlplane.extract",
    "controlplane.gate",
    "controlplane.gateway",
    "controlplane.intake",
    "controlplane.matrix",
    "controlplane.model",
    "controlplane.policy",
    "controlplane.report",
    "controlplane.release",
    "controlplane.sampling",
    "controlplane.store",
    "controlplane.validation",
]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow. The default set flags 303 `Optional[X]` -> `X | None`
# migrations and 45 import-sort complaints, none of which is a defect; a linter
# that mostly reports preferences trains people to skim its output.
#
# What is selected either catches a bug or catches a silent one:
#   F        undefined names, unused imports and variables
#   E9       syntax and IO errors
#   B905     zip() without strict -- silent truncation on a length mismatch,
#            which in this codebase means scores paired with the wrong labels
#   BLE001   blind except, which swallows the crash-loudly rule
#   PLE      pylint errors proper
select = ["F", "E9", "B905", "BLE001", "PLE"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export their public surface; the names are unused
# *there* by construction and `__all__` states the intent.
"controlplane/**/__init__.py" = ["F401"]
# Tests import fixtures and symbols for their side effects and for parametrised
# ids; unused-import there is noise rather than signal.
"tests/*.py" = ["F401"]
