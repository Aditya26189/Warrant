<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Warrant</title>
<desc id="desc">Evidence for AI evaluation decisions. Statistical contracts, replayable records, and reproducible research.</desc>
