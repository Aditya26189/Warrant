name: Documentation and preprint

on:
  push:
    branches: [main, "phase/**", "review/**"]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "COORDINATION.md"
      - "DECISIONS.md"
      - "docs/**"
      - "paper/**"
      - "reports/**"
      - "examples/**"
      - "controlplane/**"
      - "scripts/**"
      - "notebooks/**"
      - "tests/test_documentation_audit.py"
      - "tests/test_technical_paper.py"
      - "tests/test_docs_index.py"
      - "tests/test_cases_matrix.py"
      - "tests/test_invariants.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-customer.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "COORDINATION.md"
      - "DECISIONS.md"
      - "docs/**"
      - "paper/**"
      - "reports/**"
      - "examples/**"
      - "controlplane/**"
      - "scripts/**"
      - "notebooks/**"
      - "tests/test_documentation_audit.py"
      - "tests/test_technical_paper.py"
      - "tests/test_docs_index.py"
      - "tests/test_cases_matrix.py"
      - "tests/test_invariants.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-customer.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handbook-and-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-customer.txt
            requirements-docs.txt
      - name: Install documentation tools
        run: python -m pip install -r requirements-customer.txt -r requirements-docs.txt pytest
      - name: Check source, links and focused contracts
        run: |
          python paper/build.py --check
          python scripts/audit_documentation.py --check-generated --links-all
          python -m pytest tests/test_documentation_audit.py tests/test_technical_paper.py tests/test_docs_index.py tests/test_cases_matrix.py tests/test_invariants.py -q
      - name: Build strict handbook
        run: python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/warrant-handbook"
      - name: Install checksum-verified Tectonic
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, tarfile, urllib.request
          pin = json.loads(pathlib.Path("paper/toolchain.json").read_text())["platforms"]["linux-x86_64"]
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "tectonic.tar.gz"
          urllib.request.urlretrieve(pin["url"], archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == pin["sha256"]
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "tectonic"
          destination.mkdir()
          with tarfile.open(archive) as tar:
              tar.extractall(destination, filter="data")
          PY
      - name: Compile isolated preprint
        run: python paper/build.py --engine "$RUNNER_TEMP/tectonic/tectonic" --out "$RUNNER_TEMP/warrant-paper"
      - uses: actions/upload-artifact@v7
        with:
          name: handbook-and-preprint
          path: |
            ${{ runner.temp }}/warrant-handbook
            ${{ runner.temp }}/warrant-paper/warrant.pdf
            ${{ runner.temp }}/warrant-paper/build-receipt.json
            ${{ runner.temp }}/warrant-paper/compiler-output.log
