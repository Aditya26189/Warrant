name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. Fast, and it proves a claim the README makes: the customer path
  # runs on numpy, scipy and PyYAML alone. If an import creeps in from the
  # research side -- torch, sklearn, matplotlib -- this job goes red before
  # anyone notices the install got heavier.
  customer-path:
    name: customer path (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # test_acceptance.py clones this repository and runs the README's own
          # quickstart commands inside the clone, so it needs real history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the customer dependencies, and only those
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-customer.txt pytest "setuptools>=68" wheel

      - name: Prove no heavy dependency reached the customer path
        run: |
          python - <<'PY'
          import importlib.util, sys
          forbidden = ["torch", "transformers", "datasets", "spacy",
                       "sklearn", "matplotlib", "presidio_analyzer"]
          present = [p for p in forbidden if importlib.util.find_spec(p)]
          if present:
              sys.exit(f"heavy packages installed in the customer job: {present}")
          from controlplane.cli import main
          loaded = sorted({m.split(".")[0] for m in sys.modules} & set(forbidden))
          if loaded:
              sys.exit(f"the CLI imported heavy packages: {loaded}")
          print("customer path is clean")
          PY

      - name: Check the installed release package
        run: |
          python -m pip install --no-deps .
          warrant release --help
          python -I - <<'PY'
          from controlplane.release.contract import ReleaseSpec, register
          from controlplane.release.evaluate import evaluate, verify_evaluation
          print("installed release modules import under isolated Python")
          PY

      - name: The two examples, as a stranger runs them
        run: |
          python warrant.py certify --input examples/certifies.csv --budget 0.05
          python warrant.py certify --input examples/refuses.csv   --budget 0.01
          # A refusal is a result and must exit 0. If this ever exits non-zero,
          # every CI pipeline downstream would learn that "your detector cannot
          # be certified here" is a broken tool.
          python warrant.py certify --input examples/refuses.csv --budget 0.01 -q
          echo "refusal exited $? (expected 0)"

      - name: Lint
        run: |
          pip install ruff
          ruff check controlplane/ scripts/ tests/ warrant.py

      - name: The tests that run on the customer dependencies
        run: |
          FILES=$(grep -v '^#' ci/customer-path-tests.txt | grep -v '^$' | tr '\n' ' ')
          python -m pytest $FILES -q

  # Exercise the advertised minimum on Windows; the customer jobs above also
  # run the same wheel checks on Linux with Python 3.11 and 3.12.
  installed-minimum:
    name: installed wheel (Windows, Python 3.10)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install only customer dependencies and build/test tools
        run: python -m pip install -r requirements-customer.txt pytest "setuptools>=68" wheel
      - name: Check the real installed workflows, including sdist rebuild
        run: python -m pytest -o addopts= -q tests/test_package_install.py tests/test_atomic_publication.py tests/test_chain_publication.py tests/test_chain_integrity_policy.py

  # Everything else. Slow, because the research pipeline genuinely needs the
  # deep-learning stack; kept separate so a customer-path regression is visible
  # in two minutes rather than twenty.
  #
  # This job is also the only thing that proves the install command in README.md
  # works. It did not: until 2026-09-10 requirements.lock.txt was a `pip freeze`
  # of a Windows laptop, and it could not resolve anywhere (litellm==1.40.0 was
  # deleted from PyPI) let alone here (pywin32 has no Linux wheel). The lock is
  # now the resolved closure -- scripts/build_lock.py -- and this job installing
  # it is the standing check that it stays installable.
  #
  # The python-version below must match PYTHON_TARGET in scripts/build_lock.py;
  # tests/test_packaging.py fails if they drift apart.
  full-suite:
    name: full suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No `cache: pip` here, deliberately. This job downloads 3.46 GB of
          # wheels; caching them would blow the repository's 10 GB Actions cache
          # on its own and evict everything the customer-path job depends on.
          # The pip cache is also disabled below, so there would be nothing to
          # save.

      # The install needs about 9 GB and a stock runner does not have it: the
      # first attempt died on `[Errno 28] No space left on device` partway
      # through `Installing collected packages`.
      #
      # It is worth being precise about where that goes, because the shape of it
      # is the argument for this step rather than for a smaller install:
      #
      #     nvidia-* and triton   3.09 GB   89% of the download
      #     everything else       0.37 GB
      #     en_core_web_lg       ~0.59 GB   direct URL, not on PyPI
      #
      # torch on Linux pulls the whole CUDA runtime, and this runner has no GPU
      # and never will -- extraction is exempt from CI and runs on Kaggle. So
      # this is 3 GB of libraries that are downloaded, unpacked and never
      # loaded. The honest alternative is the CPU-only torch build, and it is
      # rejected on purpose: this job exists to prove that the install command
      # in README.md works, and an install of something else proves nothing
      # about it. We pay the 3 GB to keep the check honest.
      - name: Make room for the CUDA stack nothing here will use
        run: |
          df -h / | tail -1
          # Preinstalled toolchains this project does not touch. `|| true`
          # because a missing path on a future runner image must not fail a
          # build over housekeeping.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Install everything
        run: |
          python -m pip install --upgrade pip
          # pytest and the spaCy model are both in the lock -- the model as a
          # hash-pinned URL, which `spacy download` is not. Nothing to add here.
          #
          # --no-cache-dir roughly halves peak disk: without it pip keeps every
          # downloaded wheel alongside the unpacked copy, and 3.46 GB of wheels
          # is not a saving worth 3.46 GB of disk on a machine that gets one run.
          pip install --no-cache-dir -r requirements.lock.txt
          df -h / | tail -1

      # The first run ever to reach this step died with exit 134 -- SIGABRT, a
      # C-level abort with no Python exception. Two candidates, and this step is
      # arranged to tell them apart rather than to pick one:
      #
      #   OpenMP.  torch, scikit-learn and spaCy's blis each ship their own
      #            OpenMP runtime. Two of them initialising in one process
      #            aborts on Linux, which is why Windows never saw this.
      #   Memory.  A failed C++ allocation throws std::bad_alloc, and an
      #            uncaught one calls abort() -- exit 134, where an OOM-kill
      #            would have been 137.
      #
      # OMP_NUM_THREADS is set for a reason that holds either way: this project
      # requires two runs at one seed to produce identical numbers, and threaded
      # BLAS reductions are not bit-reproducible. It may also stop the abort --
      # and if it does, the peak RSS printed below says which cause it was. A
      # few GB on a 16 GB runner rules memory out and leaves OpenMP.
      #
      # -v rather than -q so the next abort names the test it died in. A dot
      # does not, and reading the extension-module dump tells you what was
      # loaded rather than what broke.
      #
      # No pipe on the pytest line. `cmd | tail` reports tail's status, so a
      # crashed suite would read as green -- the trap CLAUDE.md names.
      # -vv, not -v. pytest.ini carries `addopts = -q`, and -v only cancels it:
      # verbosity lands back at 0 and pytest prints `file.py ....` rather than
      # one line per test. That is what finally named the abort:
      #
      #   tests/test_policy.py::test_an_entrypoint_the_module_does_not_define...
      #
      # printed with no outcome after it, because the process died mid-test.
      # Not spaCy, which the dot count had suggested and which was a guess.
      #
      # That construction now runs in a child process, so a native abort is a
      # legible failure carrying the signal and the child's stderr rather than
      # a dead suite reporting nothing. See the test's own docstring.
      - name: Full test suite
        env:
          OMP_NUM_THREADS: "1"
          MKL_THREADING_LAYER: GNU
        run: |
          free -h
          echo "cores: $(nproc)"
          # -rxX prints the reason on every xfail and xpass. DECISIONS 145 is
          # carried as an xfail with the child's crash output in its reason, so
          # without this the one known defect on this platform would be a
          # silent 'x' in the summary.
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v python -m pytest tests/ -vv -rxX
          else
            python -m pytest tests/ -vv -rxX
          fi

      - name: Verify every published claim recomputes
        env:
          OMP_NUM_THREADS: "1"
          MKL_THREADING_LAYER: GNU
        run: python scripts/verify.py --no-activations
